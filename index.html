<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoVerse — Энциклопедия автомобилей</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#080b10;
    color:#fff;
    min-height:100vh;
}

header{
    background:linear-gradient(135deg,#111722,#080b10);
    padding:28px 18px;
    text-align:center;
    border-bottom:1px solid #252d3a;
    position:sticky;
    top:0;
    z-index:100;
}

header h1{
    font-size:36px;
    letter-spacing:2px;
}

header h1 span{
    color:#ff3030;
}

header p{
    color:#9ca6b5;
    margin-top:8px;
}

.controls{
    max-width:1250px;
    margin:20px auto;
    padding:0 15px;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.search{
    flex:1;
    min-width:220px;
    background:#111722;
    border:1px solid #303a4b;
    border-radius:12px;
    color:white;
    padding:14px 16px;
    font-size:16px;
    outline:none;
}

select{
    background:#111722;
    border:1px solid #303a4b;
    border-radius:12px;
    color:white;
    padding:14px;
    font-size:15px;
    outline:none;
}

.container{
    max-width:1250px;
    margin:auto;
    padding:0 15px 40px;
}

.count{
    color:#8e99aa;
    margin:10px 3px 18px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(270px,1fr));
    gap:18px;
}

.card{
    background:#111722;
    border:1px solid #252e3c;
    border-radius:18px;
    overflow:hidden;
    transition:.25s;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.card:hover{
    transform:translateY(-5px);
    border-color:#ff3030;
}

.car-image{
    width:100%;
    height:190px;
    object-fit:cover;
    display:block;
    background:#171d27;
}

.card-body{
    padding:17px;
}

.brand{
    color:#ff3b3b;
    text-transform:uppercase;
    font-size:12px;
    font-weight:bold;
    letter-spacing:1px;
}

.card h2{
    font-size:21px;
    margin:5px 0 12px;
}

.stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-bottom:14px;
}

.stat{
    background:#181f2a;
    padding:9px;
    border-radius:9px;
}

.stat small{
    display:block;
    color:#7e8999;
    font-size:11px;
}

.stat b{
    font-size:14px;
}

.details-btn{
    width:100%;
    border:0;
    border-radius:10px;
    background:#e92828;
    color:white;
    padding:12px;
    cursor:pointer;
    font-weight:bold;
    font-size:15px;
}

.details-btn:hover{
    background:#ff4141;
}

.no-results{
    text-align:center;
    padding:60px 10px;
    color:#8e99aa;
    display:none;
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.82);
    display:none;
    justify-content:center;
    align-items:center;
    padding:18px;
    z-index:500;
}

.modal.active{
    display:flex;
}

.modal-box{
    width:min(850px,100%);
    max-height:90vh;
    overflow:auto;
    background:#111722;
    border:1px solid #303a4b;
    border-radius:20px;
    position:relative;
}

.modal-img{
    width:100%;
    height:300px;
    object-fit:cover;
    background:#171d27;
}

.modal-content{
    padding:24px;
}

.modal-content h2{
    font-size:30px;
    margin-bottom:8px;
}

.modal-content .description{
    color:#adb6c4;
    line-height:1.7;
    margin-top:18px;
}

.info-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-top:18px;
}

.info{
    background:#181f2a;
    padding:13px;
    border-radius:10px;
}

.info span{
    display:block;
    color:#7e8999;
    font-size:12px;
    margin-bottom:4px;
}

.close{
    position:absolute;
    right:15px;
    top:15px;
    width:42px;
    height:42px;
    border:0;
    border-radius:50%;
    background:rgba(0,0,0,.7);
    color:#fff;
    font-size:24px;
    cursor:pointer;
    z-index:2;
}

footer{
    text-align:center;
    color:#697484;
    padding:30px 15px;
    border-top:1px solid #202734;
}

@media(max-width:600px){
    header h1{
        font-size:28px;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .modal-img{
        height:220px;
    }

    .info-grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<header>
    <h1>Auto<span>Verse</span></h1>
    <p>Энциклопедия легендарных и современных автомобилей</p>
</header>

<div class="controls">
    <input
        id="search"
        class="search"
        type="text"
        placeholder="🔎 Поиск машины или бренда..."
        autocomplete="off"
    >

    <select id="brandFilter">
        <option value="all">Все бренды</option>
    </select>

    <select id="categoryFilter">
        <option value="all">Все категории</option>
        <option value="supercar">Суперкары</option>
        <option value="sport">Спорткары</option>
        <option value="sedan">Седаны</option>
        <option value="coupe">Купе</option>
        <option value="suv">SUV</option>
        <option value="jdm">JDM</option>
        <option value="muscle">Muscle</option>
        <option value="hypercar">Гиперкары</option>
    </select>

    <select id="sort">
        <option value="default">Сортировка</option>
        <option value="powerHigh">Мощность ↓</option>
        <option value="powerLow">Мощность ↑</option>
        <option value="speedHigh">Скорость ↓</option>
        <option value="speedLow">Скорость ↑</option>
        <option value="name">По названию</option>
    </select>
</div>

<main class="container">
    <div class="count" id="count"></div>

    <div class="grid" id="grid"></div>

    <div class="no-results" id="noResults">
        <h2>Машина не найдена</h2>
        <p>Попробуй изменить запрос или фильтры.</p>
    </div>
</main>

<div class="modal" id="modal">
    <div class="modal-box">
        <button class="close" onclick="closeModal()">×</button>

        <img id="modalImg" class="modal-img" src="" alt="">

        <div class="modal-content">
            <div class="brand" id="modalBrand"></div>
            <h2 id="modalTitle"></h2>

            <div class="info-grid">
                <div class="info">
                    <span>Двигатель</span>
                    <b id="modalEngine"></b>
                </div>

                <div class="info">
                    <span>Мощность</span>
                    <b id="modalPower"></b>
                </div>

                <div class="info">
                    <span>Максимальная скорость</span>
                    <b id="modalSpeed"></b>
                </div>

                <div class="info">
                    <span>Привод</span>
                    <b id="modalDrive"></b>
                </div>

                <div class="info">
                    <span>Разгон 0–100 км/ч</span>
                    <b id="modalAccel"></b>
                </div>

                <div class="info">
                    <span>Категория</span>
                    <b id="modalCategory"></b>
                </div>
            </div>

            <p class="description" id="modalDescription"></p>
        </div>
    </div>
</div>

<footer>
    AutoVerse © 2026 — автомобильная энциклопедия
</footer>

let imageCache = {};

    const option = document.createElement("option");

function escapeHTML(text){
    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

/*
    Изображения берутся автоматически из Wikipedia.

    Важно:
    сайт сначала пытается найти страницу именно данной модели.
    Если Wikipedia не возвращает фотографию, вместо чужой
    фотографии показывается безопасная заглушка с названием.

    Благодаря этому мы НЕ показываем фотографию другой машины
    под неправильным названием.
*/

function placeholder(car){
    const svg = `
    <svg xmlns="http://www.w3.org/2000/svg" width="900" height="550">
        <rect width="100%" height="100%" fill="#171d27"/>
        <text x="50%" y="45%" text-anchor="middle"
              fill="#ffffff" font-size="42"
              font-family="Arial">${escapeHTML(car.brand)}</text>
        <text x="50%" y="58%" text-anchor="middle"
              fill="#ff4040" font-size="30"
              font-family="Arial">${escapeHTML(car.name)}</text>
        <text x="50%" y="72%" text-anchor="middle"
              fill="#8c97a7" font-size="20"
              font-family="Arial">Фото не найдено</text>
    </svg>`;

    return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
}

async function getCarImage(car){

    if(imageCache[car.name]){
        return imageCache[car.name];
    }

    const fallback = placeholder(car);

    try{

        const query = encodeURIComponent(
            car.wiki + " automobile"
        );

        const url =
            "https://en.wikipedia.org/w/api.php" +
            "?action=query" +
            "&generator=search" +
            "&gsrsearch=" + query +
            "&gsrnamespace=0" +
            "&gsrlimit=5" +
            "&prop=pageimages" +
            "&piprop=thumbnail" +
            "&pithumbsize=900" +
            "&format=json" +
            "&origin=*";

        const response = await fetch(url);

        if(!response.ok){
            imageCache[car.name] = fallback;
            return fallback;
        }

        const data = await response.json();

        if(!data.query || !data.query.pages){
            imageCache[car.name] = fallback;
            return fallback;
        }

        const pages = Object.values(data.query.pages);

        /*
            Берём только изображения, которые Wikipedia сама
            связывает с найденной статьёй. Если подходящей
            картинки нет — остаётся заглушка.
        */

        let page = pages.find(p =>
            p.thumbnail &&
            p.thumbnail.source
        );

        if(!page){
            imageCache[car.name] = fallback;
            return fallback;
        }

        imageCache[car.name] = page.thumbnail.source;
        return page.thumbnail.source;

    }catch(error){

        imageCache[car.name] = fallback;
        return fallback;
    }
}

function createCard(car,index){

    const card = document.createElement("article");
    card.className = "card";

    card.innerHTML = `
        <img
            class="car-image"
            id="car-image-${index}"
            src="${placeholder(car)}"
            alt="${escapeHTML(car.name)}"
        >

        <div class="card-body">

            <div class="brand">
                ${escapeHTML(car.brand)}
            </div>

            <h2>${escapeHTML(car.name)}</h2>

            <div class="stats">

                <div class="stat">
                    <small>Мощность</small>
                    <b>${escapeHTML(car.power)} л.с.</b>
                </div>

                <div class="stat">
                    <small>Максимальная скорость</small>
                    <b>${escapeHTML(car.speed)} км/ч</b>
                </div>

                <div class="stat">
                    <small>Двигатель</small>
                    <b>${escapeHTML(car.engine)}</b>
                </div>

                <div class="stat">
                    <small>Привод</small>
                    <b>${escapeHTML(car.drive)}</b>
                </div>

            </div>

            <button
                class="details-btn"
                onclick="openModal(${index})">
                Подробнее
            </button>

        </div>
    `;

    grid.appendChild(card);

    getCarImage(car).then(src => {

        const img = document.getElementById(
            "car-image-" + index
        );

        if(img){
            img.src = src;
        }

    });
}

function render(){

    let result = [...cars];

    const text =
        search.value
        .trim()
        .toLowerCase();

    const brand =
        brandFilter.value;

    const category =
        categoryFilter.value;

    if(text){

        result = result.filter(car =>

            car.name.toLowerCase().includes(text) ||

            car.brand.toLowerCase().includes(text) ||

            car.engine.toLowerCase().includes(text)

        );

    }

    if(brand !== "all"){

        result =
            result.filter(car =>
                car.brand === brand
            );

    }

    if(category !== "all"){

        result =
            result.filter(car =>
                car.category === category
            );

    }

    switch(sort.value){

        case "powerHigh":
            result.sort((a,b) => b.power-a.power);
            break;

        case "powerLow":
            result.sort((a,b) => a.power-b.power);
            break;

        case "speedHigh":
            result.sort((a,b) => b.speed-a.speed);
            break;

        case "speedLow":
            result.sort((a,b) => a.speed-b.speed);
            break;

        case "name":
            result.sort((a,b) =>
                a.name.localeCompare(
                    b.name,
                    "ru"
                )
            );
            break;

    }

    grid.innerHTML = "";

    count.textContent =
        `Показано автомобилей: ${result.length} из ${cars.length}`;

    noResults.style.display =
        result.length === 0
        ? "block"
        : "none";

    result.forEach((car) => {

        const originalIndex =
            cars.indexOf(car);

        createCard(
            car,
            originalIndex
        );

    });
}

function openModal(index){

    const car = cars[index];

    document.getElementById("modalBrand")
        .textContent = car.brand;

    document.getElementById("modalTitle")
        .textContent = car.name;

    document.getElementById("modalEngine")
        .textContent = car.engine;

    document.getElementById("modalPower")
        .textContent = car.power + " л.с.";

    document.getElementById("modalSpeed")
        .textContent = car.speed + " км/ч";

    document.getElementById("modalDrive")
        .textContent = car.drive;

    document.getElementById("modalAccel")
        .textContent = car.accel;

    document.getElementById("modalCategory")
        .textContent =
        categoryNames[car.category] ||
        car.category;

    document.getElementById("modalDescription")
        .textContent =
        `${car.name} — автомобиль марки ${car.brand}. ` +
        `Модель оснащается двигателем ${car.engine}, ` +
        `развивает около ${car.power} л.с. и имеет ` +
        `заявленную максимальную скорость ${car.speed} км/ч. ` +
        `Привод — ${car.drive}.`;

    const modalImg =
        document.getElementById("modalImg");

    modalImg.src =
        imageCache[car.name] ||
        placeholder(car);

    modalImg.alt = car.name;

    document
        .getElementById("modal")
        .classList.add("active");

    document.body.style.overflow = "hidden";

    getCarImage(car).then(src => {
        modalImg.src = src;
    });
}

function closeModal(){

    document
        .getElementById("modal")
        .classList.remove("active");

    document.body.style.overflow = "";
}

document
    .getElementById("modal")
    .addEventListener("click",function(e){

        if(e.target === this){
            closeModal();
        }

    });

document.addEventListener("keydown",function(e){

    if(e.key === "Escape"){
        closeModal();
    }

});

search.addEventListener("input",render);

brandFilter.addEventListener("change",render);

categoryFilter.addEventListener("change",render);

sort.addEventListener("change",render);

render();
